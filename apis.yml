name: Englease Technologies SPV Ltd
description: Englease is an online English language learning platform serving students
  across the Middle East and North Africa (MENA) region, founded by Omar Shihan and
  headquartered in Dubai Internet City, UAE. The platform blends live classes running
  16 hours a day across all seven days, self-paced on-demand courses, pronunciation
  and practice tools, and conversation clubs, with proficiency-based learning paths
  from beginner to advanced and UK-accredited certifications. Englease serves individuals,
  corporations, schools, and specific industries including hospitality, call centers,
  retail, banking, and healthcare. Englease Technologies SPV Ltd is a portfolio company
  of 500 Global, added to the API Evangelist network for tracking. The consumer product
  is delivered through a web/app experience; no public developer API surface has been
  identified.
